# Shipped by scripts/mirror-sdks.mjs in the Cookie Munch product repo — edit it there.
#
# Publishes from this public repo so npm can attach a provenance attestation: the signature
# names this repo and this workflow run, which only a GitHub Actions run with an OIDC token
# (id-token: write) can produce. package.json `repository` must name this exact repo.
name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
